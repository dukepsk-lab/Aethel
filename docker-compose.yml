services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aethel
      POSTGRES_PASSWORD: aethel
      POSTGRES_DB: aethel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn aethel.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
